name: Server Unit & Integration Tests

on:
  push:
    branches: [main, develop, UI-Automation, feature/*]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [main, develop, UI-Automation, feature/*]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

jobs:
  test:
    name: Run Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://root:password@localhost:27017/honey-do-list-test?authSource=admin
      NODE_ENV: test
      SendGridApiKey: test-sendgrid-api-key-for-ci
      FRONTEND_BASE_URL: http://localhost:3000
      # Test user environment variables for seeding tests
      TESTUSER1EMAIL: testuser1@example.com
      TESTUSER1USERNAME: testuser1
      TESTUSER1PASSWORD: testpass123
      TESTUSER2EMAIL: testuser2@example.com
      TESTUSER2USERNAME: testuser2
      TESTUSER2PASSWORD: testpass123
      TESTUSER3EMAIL: testuser3@example.com
      TESTUSER3USERNAME: testuser3
      TESTUSER3PASSWORD: testpass123
      TESTADMINEMAIL: admin@example.com
      TESTADMINUSERNAME: admin
      TESTADMINPASSWORD: adminpass123
      TESTDEMOEMAIL: demo@example.com
      TESTDEMOUSERNAME: demo
      TESTDEMOPASSWORD: demopass123

    strategy:
      matrix:
        node-version: [18, 20]
        test-type: [unit, integration, coverage]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        working-directory: server
        run: |
          npm ci
          echo "✅ Dependencies installed"

      - name: Verify MongoDB Connection
        run: |
          timeout 60s bash -c 'until mongosh --host localhost:27017 --eval "db.adminCommand(\"ping\")" --quiet; do sleep 2; done'
          echo "✅ MongoDB connection verified"

      - name: Run Unit Tests
        if: matrix.test-type == 'unit'
        working-directory: server
        run: |
          echo "🧪 Running Unit Tests on Node.js ${{ matrix.node-version }}"
          npx jest tests/setup.test.js tests/models.test.js tests/userController.test.js tests/taskController.test.js tests/emailTemplate.test.js --verbose --detectOpenHandles --forceExit

      - name: Run Integration Tests
        if: matrix.test-type == 'integration'
        working-directory: server
        run: |
          echo "🔗 Running Integration Tests on Node.js ${{ matrix.node-version }}"
          npx jest tests/task.test.js tests/seedUsers.test.js --verbose --detectOpenHandles --forceExit

      - name: Run All Tests with Coverage
        if: matrix.test-type == 'coverage' && matrix.node-version == '20'
        working-directory: server
        run: |
          echo "📊 Running Full Test Suite with Coverage"
          npm run test:coverage

      - name: Upload Coverage to Codecov
        if: matrix.test-type == 'coverage' && matrix.node-version == '20' && success()
        uses: codecov/codecov-action@v3
        with:
          file: ./server/coverage/lcov.info
          flags: server
          name: server-coverage
          fail_ci_if_error: false

      - name: Generate Test Summary
        if: always()
        working-directory: server
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version:** ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Type:** ${{ matrix.test-type }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.test-type }}" == "coverage" ] && [ "${{ matrix.node-version }}" == "20" ]; then
            if [ -f coverage/lcov-report/index.html ]; then
              echo "- **Coverage Report:** Generated successfully" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Generate Overall Summary
        run: |
          echo "## Server Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "All test jobs have completed. Check individual job results above." >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage:" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: User Controllers, Task Controllers, Models, Email Templates" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: Database Operations, Task Queries, User Seeding" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Analysis: Comprehensive code coverage reporting" >> $GITHUB_STEP_SUMMARY