name: UI Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, feature/*]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: Honey-Do-List FE (Develop) (pacific-recreation / production)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d'.' -f1)
          DRIVER_VERSION=$(wget -qO- "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")
          wget "https://chromedriver.storage.googleapis.com/${DRIVER_VERSION}/chromedriver_linux64.zip"
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedrive

      - name: Run UI automation tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL }}
          TEST_PASSWORD: ${{ vars.TEST_PASSWORD }}
          TEST_USERNAME: ${{ vars.TEST_USERNAME }}
          NEW_TEST_USERNAME: ${{ vars.NEW_TEST_USERNAME }}
          NEW_TEST_PASSWORD: ${{ vars.NEW_TEST_PASSWORD }}
        run: |
          python test/e2e/run.py