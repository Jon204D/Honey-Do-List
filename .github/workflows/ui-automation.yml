name: UI Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, feature/*]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: Honey-Do-List FE (Develop) (pacific-recreation / production)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui-requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Run UI automation tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TESTUSER1EMAIL: ${{ vars.TESTUSER1EMAIL }}
          TESTUSER1PASSWORD: ${{ vars.TESTUSER1PASSWORD }}
          TESTUSER1USERNAME: ${{ vars.TESTUSER1USERNAME }}
          TESTUSER3EMAIL: ${{ vars.TESTUSER3EMAIL }}
          TESTUSER3USERNAME: ${{ vars.TESTUSER3USERNAME }}
          TESTUSER3PASSWORD: ${{ vars.TESTUSER3PASSWORD }}
        run: |
          python test/e2e/run.py